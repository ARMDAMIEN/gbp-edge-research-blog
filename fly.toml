app = 'gbp-edge-research-blog'
primary_region = 'cdg'

# One-shot weekly job: the machine runs `tsx src/index.ts` once and exits.
# It must NOT auto-restart on exit (success or crash), or it would loop.
[[restart]]
  policy = 'never'

[build]

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 1

[[mounts]]
  source = 'gerb_data'
  destination = '/app/data'
  initial_size = '1gb'
